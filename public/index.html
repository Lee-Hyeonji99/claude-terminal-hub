<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Terminal Hub</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <style>
    :root{
      --bg:#0c0e14; --panel:#12151f; --head:#1a1e2b; --border:#262c3d;
      --active:#4c8bf5; --text:#d7dbe6; --muted:#8a91a5; --accent:#4c8bf5; --danger:#e5484d; --ok:#3fb950;
      --sb-thumb:#39415a;
    }
    body[data-theme="dracula"]{
      --bg:#282a36; --panel:#282a36; --head:#21222c; --border:#44475a;
      --active:#bd93f9; --text:#f8f8f2; --muted:#8592b8; --accent:#bd93f9; --danger:#ff5858; --ok:#50fa7b;
      --sb-thumb:#44475a;
    }
    body[data-theme="solarized"]{
      --bg:#002b36; --panel:#002b36; --head:#073642; --border:#586e75;
      --active:#3295da; --text:#93a1a1; --muted:#79939a; --accent:#3295da; --danger:#e56764; --ok:#859900;
      --sb-thumb:#073642;
    }
    body[data-theme="nord"]{
      --bg:#2e3440; --panel:#2e3440; --head:#3b4252; --border:#4c566a;
      --active:#88c0d0; --text:#d8dee9; --muted:#939eb2; --accent:#81a1c1; --danger:#d08b91; --ok:#a3be8c;
      --sb-thumb:#4c566a;
    }
    body[data-theme="onedark"]{
      --bg:#282c34; --panel:#282c34; --head:#21252b; --border:#3e4451;
      --active:#61afef; --text:#abb2bf; --muted:#8d95a2; --accent:#61afef; --danger:#e1737b; --ok:#98c379;
      --sb-thumb:#3e4451;
    }
    body[data-theme="gruvbox"]{
      --bg:#282828; --panel:#282828; --head:#3c3836; --border:#504945;
      --active:#83a598; --text:#ebdbb2; --muted:#a89984; --accent:#83a598; --danger:#fb5844; --ok:#b8bb26;
      --sb-thumb:#504945;
    }
    body[data-theme="monokai"]{
      --bg:#272822; --panel:#272822; --head:#1e1f1c; --border:#49483e;
      --active:#66d9ef; --text:#f8f8f2; --muted:#94907a; --accent:#66d9ef; --danger:#fa4d8c; --ok:#a6e22e;
      --sb-thumb:#49483e;
    }
    body[data-theme="tokyonight"]{
      --bg:#1a1b26; --panel:#1a1b26; --head:#16161e; --border:#414868;
      --active:#7aa2f7; --text:#c0caf5; --muted:#7a83ab; --accent:#7aa2f7; --danger:#f7768e; --ok:#9ece6a;
      --sb-thumb:#414868;
    }
    body[data-theme="catppuccin"]{
      --bg:#1e1e2e; --panel:#1e1e2e; --head:#181825; --border:#313244;
      --active:#89b4fa; --text:#cdd6f4; --muted:#9399b2; --accent:#89b4fa; --danger:#f38ba8; --ok:#a6e3a1;
      --sb-thumb:#313244;
    }
    body[data-theme="githubdark"]{
      --bg:#0d1117; --panel:#0d1117; --head:#161b22; --border:#30363d;
      --active:#58a6ff; --text:#c9d1d9; --muted:#8b949e; --accent:#58a6ff; --danger:#ff7b72; --ok:#3fb950;
      --sb-thumb:#30363d;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    /* 스크롤바 (앱 전역, 다크/라이트 대응) */
    *{scrollbar-color:var(--sb-thumb) var(--bg);scrollbar-width:thin}
    ::-webkit-scrollbar{width:12px;height:12px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-corner{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:8px;border:3px solid var(--bg)}
    ::-webkit-scrollbar-thumb:hover{background:var(--muted)}
    body{background:var(--bg);color:var(--text);font:13px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
    header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--head);border-bottom:1px solid var(--border);flex:none}
    header .brand{font-weight:600;letter-spacing:.3px}
    header .brand span{color:var(--accent)}
    header .spacer{flex:1}
    header .status{color:var(--muted);font-size:12px}
    select,button,input{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font:inherit}
    button{cursor:pointer}
    button:hover{border-color:var(--accent)}
    button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
    button.primary:hover{filter:brightness(1.1)}
    button.ghost{background:transparent}
    /* 아이콘 (SVG, currentColor) */
    svg{display:block}
    [data-icon],.i{display:inline-flex;align-items:center}
    header button,#tabs button,.sesactions button,#pickHere,.mhead button,#changeFolder{display:inline-flex;align-items:center;gap:6px}
    button [data-icon]{pointer-events:none}
    .icon-btn{padding:6px 8px !important;line-height:0}
    .fontsize-group{display:flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:6px;padding:2px}
    .fontsize-group button{border:none;padding:4px 8px;font-size:12px;font-weight:700;border-radius:4px}
    .fontsize-group #fontSizeLabel{color:var(--muted);font-size:11px;min-width:20px;text-align:center;user-select:none}
    .recent-item .rf svg,.fsitem .ico svg,.pane .bar .cwd svg{color:var(--muted)}
    .sesitem .ico svg{color:var(--accent);width:18px;height:18px}
    .pane .bar button svg{width:15px;height:15px}
    .pane .bar button.artifact{display:inline-flex !important;align-items:center;gap:4px;color:var(--accent);border:1px solid var(--accent);border-radius:10px;font-size:11px;padding:1px 8px;max-width:180px}
    .pane .bar button.artifact[style*="none"]{display:none !important}
    .pane .bar button.artifact .alabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    /* 작업 완료(벨) 표시 — 비활성 세션이 끝났을 때 어느 세션인지 보이게 (초록 테두리+점 펄스) */
    .pane.done{box-shadow:0 0 0 2px var(--ok)}
    .pane.done .bar .dot{background:var(--ok);animation:cthpulse 1.1s infinite}
    .pane .bar .cwd svg{width:12px;height:12px;vertical-align:-2px}
    .lnb-search{position:relative}
    .lnb-search .search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}

    #tabs{display:flex;align-items:center;gap:4px;padding:4px 8px;background:var(--bg);border-bottom:1px solid var(--border);flex:none;overflow-x:auto}
    #tabList{display:flex;gap:4px}
    .tab{display:flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--border);border-radius:7px 7px 0 0;background:var(--panel);color:var(--muted);cursor:pointer;font-size:12px;white-space:nowrap}
    .tab.active{color:var(--text);background:var(--head);border-color:var(--active);border-bottom-color:var(--head)}
    .tab .cnt{color:var(--accent);font-size:10px}
    .tab .tclose{border:none;background:transparent;color:var(--muted);padding:0 2px;font-size:12px;line-height:1}
    .tab .tclose:hover{color:var(--danger)}
    #addProfile{padding:4px 10px;font-size:12px}
    #main{flex:1;display:flex;min-height:0;overflow:hidden}
    #lnb{width:260px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);transition:width .15s ease}
    body.lnb-collapsed #lnb{width:0;border-right:none;overflow:hidden}
    #lnb .lnb-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap}
    .lnb-search{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border)}
    .lnb-search input{flex:1;font-size:12px;padding:5px 8px 5px 30px}
    .lnb-search button{padding:4px 8px}
    .recent-list{flex:1;overflow:auto;padding:6px}
    .recent-item .rename{float:right;color:var(--muted);font-size:12px;padding:0 4px;border:none;background:transparent}
    .recent-item .rename:hover{color:var(--accent)}
    .recent-item{padding:8px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
    .recent-item:hover{background:var(--head);border-color:var(--border)}
    .recent-item .rt{display:flex;align-items:center;gap:4px;color:var(--text);font-size:12px}
    .recent-item .rf{display:flex;align-items:center;gap:4px;color:var(--accent);font-size:11px;margin-top:3px}
    .recent-item .rt svg,.recent-item .rf svg{flex:none}
    .recent-item .rt span,.recent-item .rf span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .recent-item .rs{color:var(--muted);font-size:10px;margin-top:2px}
    .recent-item .rs .rprof{color:var(--accent)}
    .recent-item .rcont{display:block;width:100%;margin-top:6px;padding:4px 8px;font-size:11px;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:6px;cursor:pointer}
    .recent-item .rcont:hover{background:var(--accent);color:#fff}
    .recent-empty{color:var(--muted);font-size:12px;padding:14px;text-align:center}
    .lnb-head-btns{display:flex;align-items:center;gap:4px;flex:none}
    .lnb-alltoggle{font-size:10px;color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:10px;padding:2px 8px;cursor:pointer;white-space:nowrap}
    .lnb-alltoggle:hover{color:var(--text)}
    .lnb-alltoggle.on{color:var(--accent);border-color:var(--accent)}
    #stage{flex:1;position:relative;display:flex;min-height:0;overflow:hidden}
    .column{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
    .pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:4px}
    .pane.active{border-color:var(--active);box-shadow:0 0 0 1px var(--active)}
    .pane .bar{display:flex;align-items:center;gap:8px;padding:4px 8px;background:var(--head);border-bottom:1px solid var(--border);flex:none;font-size:12px}
    .pane .bar .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
    .pane.running .bar .dot{background:var(--ok)}
    .pane.exited .bar .dot{background:var(--danger)}
    .pane .bar{cursor:grab;user-select:none}
    .pane .bar.grabbing{cursor:grabbing}
    .pane .bar .label{flex:1;min-width:0;display:flex;align-items:center;color:var(--muted);white-space:nowrap;overflow:hidden}
    .pane .bar .label .ttl{display:inline-flex;align-items:center;gap:4px;min-width:0;color:var(--text);font-weight:600;flex:none}
    .pane .bar .label .ttl svg{flex:none}
    .pane .bar .label .ttl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pane .bar .label .cwd{display:inline-flex;align-items:center;gap:3px;flex:1;min-width:0;color:var(--muted);font-size:11px;margin-left:6px}
    .pane .bar .label .cwd span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pane .bar .label .cwd svg{flex:none}
    .pane.dragging{opacity:.45}
    #dropIndicator{position:fixed;z-index:60;pointer-events:none;display:none;border:2px solid var(--active);background:rgba(76,139,245,.22);border-radius:6px;box-shadow:0 0 0 1px rgba(76,139,245,.5) inset}
    #dropIndicator .dz{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:12px;font-weight:600;background:var(--active);padding:2px 8px;border-radius:4px;white-space:nowrap}
    .disc-banner{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 10px;background:rgba(229,72,77,.92);color:#fff;font-size:12px}
    .disc-banner button{background:#fff;color:#b3121a;border:none;border-radius:5px;padding:4px 12px;font-weight:600;cursor:pointer}
    .pane .bar button{border:none;background:transparent;color:var(--muted);padding:2px 6px;border-radius:4px;line-height:1;font-size:13px}
    .pane .bar button:hover{color:var(--text);background:var(--head)}
    .pane .bar button.x:hover{background:var(--danger)}
    .pane .bar button.auto{font-size:10px;border:1px solid var(--border);border-radius:10px;padding:1px 8px}
    .pane .bar button.auto.on{color:var(--ok);border-color:var(--ok)}
    /* 새 메시지 감지 시 새로고침(⟳) 버튼이 깜빡여 알림 */
    .pane.has-changes .bar button.reload{color:#f0a020;animation:cthpulse 1.1s infinite}
    @keyframes cthpulse{50%{opacity:.3}}
    .pane .term{flex:1;min-height:0;padding:4px 6px}
    .pane .term .xterm{height:100%}
    .pane .preview{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff}
    .pane .preview .urlbar{display:flex;gap:4px;padding:4px 6px;background:var(--head);border-bottom:1px solid var(--border);flex:none}
    .pane .preview .urlbar input{flex:1;font-size:12px;font-family:Consolas,monospace;padding:4px 8px}
    .pane .preview iframe{flex:1;width:100%;border:none;background:#fff}
    body.dragging-pane .preview iframe{pointer-events:none}

    .gutter{background:var(--bg);background-repeat:no-repeat;background-position:50%}
    .gutter:hover{background-color:var(--active)}
    .gutter.gutter-horizontal{cursor:col-resize}
    .gutter.gutter-vertical{cursor:row-resize}

    #empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--muted);text-align:center;pointer-events:none}
    #empty button{pointer-events:auto}

    /* 모달 */
    #overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
    #overlay.open{display:flex}
    .modal{width:min(680px,94vw);max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .modal .mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
    .modal .mhead h2{margin:0;font-size:15px;flex:1}
    .modal .mbody{padding:14px 18px;overflow:auto}
    .modal .mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border)}

    .pathbar{display:flex;gap:6px;margin-bottom:10px}
    .pathbar input{flex:1;font-family:Consolas,monospace}
    .drives{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .drives button{padding:4px 10px;font-family:Consolas,monospace}
    .fslist{border:1px solid var(--border);border-radius:8px;max-height:320px;overflow:auto}
    .fsitem{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
    .fsitem:last-child{border-bottom:none}
    .fsitem:hover{background:var(--head)}
    .fsitem .ico{width:16px;text-align:center;opacity:.8}
    .fsitem.up{color:var(--muted)}
    .fsnote{color:var(--muted);font-size:11px;padding:6px 2px}

    .seshead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .seshead .cwd{flex:1;font-family:Consolas,monospace;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .placement{display:flex;gap:6px;margin:6px 0 12px}
    .placement label{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;border:1px solid var(--border);padding:5px 9px;border-radius:6px;cursor:pointer}
    .placement input{margin:0}
    .sesactions{display:flex;gap:8px;margin-bottom:12px}
    .seslist{border:1px solid var(--border);border-radius:8px;max-height:300px;overflow:auto}
    .sesitem{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
    .sesitem:last-child{border-bottom:none}
    .sesitem:hover{background:var(--head)}
    .sesitem .meta{flex:1;min-width:0}
    .sesitem .title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sesitem .sub{color:var(--muted);font-size:11px;margin-top:2px}
    .sesempty{color:var(--muted);padding:16px;text-align:center}
    .hint{color:var(--muted);font-size:11px;margin-top:6px}

    .popover-wrap{position:relative}
    .popover{position:absolute;top:calc(100% + 6px);right:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.35);padding:6px;min-width:170px;max-height:70vh;overflow-y:auto;z-index:40;display:none}
    .popover.open{display:block}
    .popover-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);white-space:nowrap}
    .popover-item:hover{background:var(--head)}
    .popover-item.active{background:var(--head);font-weight:600}
    .popover-item .swatch{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(128,128,128,.35)}

    /* 인페이지 프롬프트/확인 모달 (네이티브 prompt/confirm 대체) */
    #promptOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:70}
    #promptOverlay.open{display:flex}
    .pmodal{width:min(460px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
    .pmodal .pm-title{font-size:14px;font-weight:600;margin-bottom:12px;white-space:pre-line}
    .pmodal .pm-msg{color:var(--muted);font-size:12px;margin-bottom:6px;white-space:pre-line}
    .pmodal input{width:100%;font-size:13px;padding:8px 10px}
    .pmodal .pm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  </style>
</head>
<body>
  <header>
    <button id="lnbToggle" class="ghost icon-btn" title="사이드바 접기/펼치기"><span data-icon="menu"></span></button>
    <div class="brand">Claude <span>Terminal Hub</span></div>
    <button id="add" class="primary"><span data-icon="plus"></span> 새 세션</button>
    <button id="addWeb" class="ghost" title="웹 미리보기 패널 추가"><span data-icon="globe"></span> 웹 미리보기</button>
    <button id="addFile" class="ghost" title="로컬 파일 미리보기 (HTML/이미지/MD)"><span data-icon="file"></span> 파일 열기</button>
    <div class="spacer"></div>
    <span class="status" id="status">세션 0</span>
    <div class="popover-wrap">
      <button id="themeBtn" class="ghost icon-btn" title="색상 테마"><span data-icon="palette"></span></button>
      <div id="themePopover" class="popover">
        <div class="popover-item" data-theme="dark"><span class="swatch" style="background:#0c0e14"></span>다크 (기본)</div>
        <div class="popover-item" data-theme="dracula"><span class="swatch" style="background:#282a36"></span>Dracula</div>
        <div class="popover-item" data-theme="solarized"><span class="swatch" style="background:#002b36"></span>Solarized Dark</div>
        <div class="popover-item" data-theme="nord"><span class="swatch" style="background:#2e3440"></span>Nord</div>
        <div class="popover-item" data-theme="onedark"><span class="swatch" style="background:#282c34"></span>One Dark</div>
        <div class="popover-item" data-theme="gruvbox"><span class="swatch" style="background:#282828"></span>Gruvbox Dark</div>
        <div class="popover-item" data-theme="monokai"><span class="swatch" style="background:#272822"></span>Monokai</div>
        <div class="popover-item" data-theme="tokyonight"><span class="swatch" style="background:#1a1b26"></span>Tokyo Night</div>
        <div class="popover-item" data-theme="catppuccin"><span class="swatch" style="background:#1e1e2e"></span>Catppuccin Mocha</div>
        <div class="popover-item" data-theme="githubdark"><span class="swatch" style="background:#0d1117"></span>GitHub Dark</div>
      </div>
    </div>
    <div class="popover-wrap">
      <button id="accentBtn" class="ghost icon-btn" title="강조 색상"><span data-icon="droplet"></span></button>
      <div id="accentPopover" class="popover"></div>
    </div>
    <select id="fontFamily" class="ghost" title="터미널 글꼴" style="padding:4px 6px;font-size:11px"></select>
    <div class="fontsize-group">
      <button id="fontDown" title="터미널 글자 크기 작게 (Ctrl+-)">A−</button>
      <span id="fontSizeLabel">13</span>
      <button id="fontUp" title="터미널 글자 크기 크게 (Ctrl++)">A+</button>
    </div>
  </header>

  <div id="tabs">
    <div id="tabList"></div>
    <button id="addProfile" class="ghost" title="새 계정(프로필) 추가"><span data-icon="plus"></span> 프로필</button>
  </div>

  <div id="dropIndicator"><span class="dz"></span></div>

  <div id="main">
    <aside id="lnb">
      <div class="lnb-head">
        <span id="lnbTitle">최근 세션</span>
        <div class="lnb-head-btns">
          <button id="lnbAllToggle" class="lnb-alltoggle" title="모든 계정의 세션을 함께 보기 (다른 계정 대화 이어가기)">모든 계정</button>
          <button id="lnbRefresh" class="ghost icon-btn" title="새로고침"><span data-icon="refresh"></span></button>
        </div>
      </div>
      <div class="lnb-search">
        <span class="search-ico" data-icon="search"></span>
        <input type="text" id="lnbSearch" spellcheck="false" placeholder="모든 세션 이름/경로 검색…" autocomplete="off" />
        <button id="lnbSearchClear" class="ghost icon-btn" title="지우기" style="display:none"><span data-icon="x"></span></button>
      </div>
      <div id="recentList" class="recent-list"></div>
    </aside>
    <div id="stage">
      <div id="empty">
        <div>열린 세션이 없습니다.</div>
        <button class="primary" onclick="startNewSession()"><span data-icon="plus"></span> 새 세션 열기</button>
      </div>
    </div>
  </div>

  <!-- 모달 -->
  <div id="overlay">
    <!-- 1단계: 폴더 선택 -->
    <div class="modal" id="folderModal" style="display:none">
      <div class="mhead">
        <h2>작업 폴더 선택</h2>
        <button class="ghost icon-btn" data-close><span data-icon="x"></span></button>
      </div>
      <div class="mbody">
        <label style="display:block;color:var(--muted);font-size:12px;margin-bottom:5px">작업 폴더를 직접 입력(붙여넣고 Enter)하거나, 아래 최근 경로에서 고르세요. 새 폴더 생성은 오른쪽 <b>폴더 선택기</b>.</label>
        <div class="pathbar">
          <input type="text" id="curPath" spellcheck="false" placeholder="예: C:\projects\my-project — 붙여넣고 Enter" />
          <button id="osPick" class="primary" title="Windows 폴더 선택기"><span data-icon="folder"></span> 선택기</button>
        </div>
        <div style="color:var(--muted);font-size:12px;margin:10px 2px 4px">최근 작업 경로</div>
        <div class="fslist" id="recentPaths"></div>
        <div class="fsnote" id="fsnote"></div>
      </div>
      <div class="mfoot">
        <button data-close>취소</button>
        <button class="primary" id="pickHere">이 폴더 선택</button>
      </div>
    </div>

    <!-- 2단계: 세션 목록 -->
    <div class="modal" id="sessionModal" style="display:none">
      <div class="mhead"><h2>세션</h2><button class="ghost icon-btn" data-close><span data-icon="x"></span></button></div>
      <div class="mbody">
        <div class="seshead">
          <div class="cwd" id="sesCwd"></div>
        </div>
        <div class="placement">
          <span style="color:var(--muted);font-size:12px;align-self:center">열기 위치:</span>
          <label><input type="radio" name="placement" value="column" checked /> 새 열(가로 분할)</label>
          <label><input type="radio" name="placement" value="row" /> 활성 패널 아래(세로 분할)</label>
        </div>
        <div class="sesactions">
          <button class="primary" id="newChat"><span data-icon="plus"></span> 새 대화 시작 (claude)</button>
          <button id="customCmd">명령 직접 입력…</button>
        </div>
        <div style="color:var(--muted);font-size:12px;margin-bottom:6px">이어서 진행할 세션 <span id="sesCount"></span></div>
        <div class="seslist" id="seslist"></div>
        <div class="hint">세션을 클릭하면 <code>claude --resume &lt;id&gt;</code> 로 그 대화를 이어서 엽니다.</div>
      </div>
      <div class="mfoot">
        <button id="changeFolder"><span data-icon="back"></span> 이전</button>
        <button data-close>닫기</button>
      </div>
    </div>
    <!-- (end session modal) -->
  </div>

  <div id="promptOverlay">
    <div class="pmodal">
      <div class="pm-title" id="pmTitle"></div>
      <div class="pm-msg" id="pmMsg"></div>
      <input type="text" id="pmInput" spellcheck="false" autocomplete="off" />
      <div class="pm-actions">
        <button id="pmCancel">취소</button>
        <button id="pmOk" class="primary">확인</button>
      </div>
    </div>
  </div>

  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="/vendor/addon-canvas/lib/addon-canvas.js"></script>
  <script src="/vendor/split/split.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
