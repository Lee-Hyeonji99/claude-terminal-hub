<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Terminal Hub</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <style>
    :root{
      --bg:#0c0e14; --panel:#12151f; --head:#1a1e2b; --border:#262c3d;
      --active:#4c8bf5; --text:#d7dbe6; --muted:#8a91a5; --accent:#4c8bf5; --danger:#e5484d; --ok:#3fb950;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{background:var(--bg);color:var(--text);font:13px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
    header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--head);border-bottom:1px solid var(--border);flex:none}
    header .brand{font-weight:600;letter-spacing:.3px}
    header .brand span{color:var(--accent)}
    header .spacer{flex:1}
    header .status{color:var(--muted);font-size:12px}
    select,button,input{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font:inherit}
    button{cursor:pointer}
    button:hover{border-color:var(--accent)}
    button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
    button.primary:hover{filter:brightness(1.1)}
    button.ghost{background:transparent}

    #tabs{display:flex;align-items:center;gap:4px;padding:4px 8px;background:#0e1119;border-bottom:1px solid var(--border);flex:none;overflow-x:auto}
    #tabList{display:flex;gap:4px}
    .tab{display:flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--border);border-radius:7px 7px 0 0;background:var(--panel);color:var(--muted);cursor:pointer;font-size:12px;white-space:nowrap}
    .tab.active{color:var(--text);background:var(--head);border-color:var(--active);border-bottom-color:var(--head)}
    .tab .cnt{color:var(--accent);font-size:10px}
    .tab .tclose{border:none;background:transparent;color:var(--muted);padding:0 2px;font-size:12px;line-height:1}
    .tab .tclose:hover{color:var(--danger)}
    #addProfile{padding:4px 10px;font-size:12px}
    #main{flex:1;display:flex;min-height:0;overflow:hidden}
    #lnb{width:260px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);transition:width .15s ease}
    body.lnb-collapsed #lnb{width:0;border-right:none;overflow:hidden}
    #lnb .lnb-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap}
    .lnb-search{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border)}
    .lnb-search input{flex:1;font-size:12px;padding:5px 8px}
    .lnb-search button{padding:4px 8px}
    .recent-list{flex:1;overflow:auto;padding:6px}
    .recent-item .rename{float:right;color:var(--muted);font-size:11px;padding:0 4px;border:none;background:transparent;visibility:hidden}
    .recent-item:hover .rename{visibility:visible}
    .recent-item .rename:hover{color:var(--accent)}
    .recent-item{padding:8px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
    .recent-item:hover{background:var(--head);border-color:var(--border)}
    .recent-item .rt{color:var(--text);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .recent-item .rf{color:var(--accent);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .recent-item .rs{color:var(--muted);font-size:10px;margin-top:2px}
    .recent-empty{color:var(--muted);font-size:12px;padding:14px;text-align:center}
    #stage{flex:1;position:relative;display:flex;min-height:0;overflow:hidden}
    .column{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
    .pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:4px}
    .pane.active{border-color:var(--active);box-shadow:0 0 0 1px var(--active)}
    .pane .bar{display:flex;align-items:center;gap:8px;padding:4px 8px;background:var(--head);border-bottom:1px solid var(--border);flex:none;font-size:12px}
    .pane .bar .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
    .pane.running .bar .dot{background:var(--ok)}
    .pane.exited .bar .dot{background:var(--danger)}
    .pane .bar{cursor:grab;user-select:none}
    .pane .bar.grabbing{cursor:grabbing}
    .pane .bar .label{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pane .bar .label .ttl{color:var(--text);font-weight:600}
    .pane .bar .label .cwd{color:var(--muted);font-size:11px;margin-left:6px}
    .pane.dragging{opacity:.45}
    #dropIndicator{position:fixed;z-index:60;pointer-events:none;display:none;border:2px solid var(--active);background:rgba(76,139,245,.22);border-radius:6px;box-shadow:0 0 0 1px rgba(76,139,245,.5) inset}
    #dropIndicator .dz{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:12px;font-weight:600;background:var(--active);padding:2px 8px;border-radius:4px;white-space:nowrap}
    .disc-banner{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 10px;background:rgba(229,72,77,.92);color:#fff;font-size:12px}
    .disc-banner button{background:#fff;color:#b3121a;border:none;border-radius:5px;padding:4px 12px;font-weight:600;cursor:pointer}
    .pane .bar button{border:none;background:transparent;color:var(--muted);padding:2px 6px;border-radius:4px;line-height:1;font-size:13px}
    .pane .bar button:hover{color:#fff;background:#2a3145}
    .pane .bar button.x:hover{background:var(--danger)}
    .pane .bar button.changed{display:none;color:#f0a020;font-size:11px}
    .pane.has-changes .bar button.changed{display:inline-block;animation:cthpulse 1.2s infinite}
    .pane .bar button.auto.on{color:var(--ok)}
    @keyframes cthpulse{50%{opacity:.35}}
    .pane .term{flex:1;min-height:0;padding:4px 6px}
    .pane .term .xterm{height:100%}
    .pane .preview{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff}
    .pane .preview .urlbar{display:flex;gap:4px;padding:4px 6px;background:var(--head);border-bottom:1px solid var(--border);flex:none}
    .pane .preview .urlbar input{flex:1;font-size:12px;font-family:Consolas,monospace;padding:4px 8px}
    .pane .preview iframe{flex:1;width:100%;border:none;background:#fff}
    body.dragging-pane .preview iframe{pointer-events:none}

    .gutter{background:#0c0e14;background-repeat:no-repeat;background-position:50%}
    .gutter:hover{background-color:var(--active)}
    .gutter.gutter-horizontal{cursor:col-resize}
    .gutter.gutter-vertical{cursor:row-resize}

    #empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--muted);text-align:center;pointer-events:none}
    #empty button{pointer-events:auto}

    /* 모달 */
    #overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
    #overlay.open{display:flex}
    .modal{width:min(680px,94vw);max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .modal .mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
    .modal .mhead h2{margin:0;font-size:15px;flex:1}
    .modal .mbody{padding:14px 18px;overflow:auto}
    .modal .mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border)}

    .pathbar{display:flex;gap:6px;margin-bottom:10px}
    .pathbar input{flex:1;font-family:Consolas,monospace}
    .drives{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .drives button{padding:4px 10px;font-family:Consolas,monospace}
    .fslist{border:1px solid var(--border);border-radius:8px;max-height:320px;overflow:auto}
    .fsitem{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;border-bottom:1px solid #1c2130}
    .fsitem:last-child{border-bottom:none}
    .fsitem:hover{background:var(--head)}
    .fsitem .ico{width:16px;text-align:center;opacity:.8}
    .fsitem.up{color:var(--muted)}
    .fsnote{color:var(--muted);font-size:11px;padding:6px 2px}

    .seshead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .seshead .cwd{flex:1;font-family:Consolas,monospace;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .placement{display:flex;gap:6px;margin:6px 0 12px}
    .placement label{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;border:1px solid var(--border);padding:5px 9px;border-radius:6px;cursor:pointer}
    .placement input{margin:0}
    .sesactions{display:flex;gap:8px;margin-bottom:12px}
    .seslist{border:1px solid var(--border);border-radius:8px;max-height:300px;overflow:auto}
    .sesitem{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;cursor:pointer;border-bottom:1px solid #1c2130}
    .sesitem:last-child{border-bottom:none}
    .sesitem:hover{background:var(--head)}
    .sesitem .meta{flex:1;min-width:0}
    .sesitem .title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sesitem .sub{color:var(--muted);font-size:11px;margin-top:2px}
    .sesempty{color:var(--muted);padding:16px;text-align:center}
    .hint{color:var(--muted);font-size:11px;margin-top:6px}
  </style>
</head>
<body>
  <header>
    <button id="lnbToggle" class="ghost" title="사이드바 접기/펼치기" style="padding:6px 10px">☰</button>
    <div class="brand">Claude <span>Terminal Hub</span></div>
    <button id="add" class="primary">＋ 새 세션</button>
    <button id="addWeb" class="ghost" title="웹 미리보기 패널 추가">🌐 웹 미리보기</button>
    <div class="spacer"></div>
    <span class="status" id="status">세션 0</span>
  </header>

  <div id="tabs">
    <div id="tabList"></div>
    <button id="addProfile" class="ghost" title="새 계정(프로필) 추가">＋ 프로필</button>
  </div>

  <div id="dropIndicator"><span class="dz"></span></div>

  <div id="main">
    <aside id="lnb">
      <div class="lnb-head">
        <span id="lnbTitle">최근 세션</span>
        <button id="lnbRefresh" class="ghost" title="새로고침" style="padding:2px 7px">⟳</button>
      </div>
      <div class="lnb-search">
        <input type="text" id="lnbSearch" spellcheck="false" placeholder="🔍 모든 세션 이름/경로 검색…" autocomplete="off" />
        <button id="lnbSearchClear" class="ghost" title="지우기" style="display:none">✕</button>
      </div>
      <div id="recentList" class="recent-list"></div>
    </aside>
    <div id="stage">
      <div id="empty">
        <div>열린 세션이 없습니다.</div>
        <button class="primary" onclick="startNewSession()">＋ 새 세션 열기</button>
      </div>
    </div>
  </div>

  <!-- 모달 -->
  <div id="overlay">
    <!-- 1단계: 폴더 선택 -->
    <div class="modal" id="folderModal" style="display:none">
      <div class="mhead">
        <h2>작업 폴더 선택</h2>
        <button id="osPick" class="primary" style="padding:6px 12px">🗂 Windows 폴더 선택기</button>
        <button class="ghost" data-close>✕</button>
      </div>
      <div class="mbody">
        <label style="display:block;color:var(--muted);font-size:12px;margin-bottom:5px">경로 붙여넣기 — 붙여넣고 바로 아래 <b>“이 폴더 선택”</b> (또는 아래 목록에서 탐색)</label>
        <div class="pathbar">
          <input type="text" id="curPath" spellcheck="false" placeholder="예: C:\projects\my-project" />
          <button id="goPath" title="이 경로의 하위 폴더 보기">목록 보기</button>
        </div>
        <div class="drives" id="drives"></div>
        <div class="fslist" id="fslist"></div>
        <div class="fsnote" id="fsnote"></div>
      </div>
      <div class="mfoot">
        <button data-close>취소</button>
        <button class="primary" id="pickHere">이 폴더 선택 →</button>
      </div>
    </div>

    <!-- 2단계: 세션 목록 -->
    <div class="modal" id="sessionModal" style="display:none">
      <div class="mhead"><h2>세션</h2><button class="ghost" data-close>✕</button></div>
      <div class="mbody">
        <div class="seshead">
          <div class="cwd" id="sesCwd"></div>
          <button class="ghost" id="changeFolder">← 폴더 변경</button>
        </div>
        <div class="placement">
          <span style="color:var(--muted);font-size:12px;align-self:center">열기 위치:</span>
          <label><input type="radio" name="placement" value="column" checked /> 새 열(가로 분할)</label>
          <label><input type="radio" name="placement" value="row" /> 활성 패널 아래(세로 분할)</label>
        </div>
        <div class="sesactions">
          <button class="primary" id="newChat">＋ 새 대화 시작 (claude)</button>
          <button id="customCmd">명령 직접 입력…</button>
        </div>
        <div style="color:var(--muted);font-size:12px;margin-bottom:6px">이어서 진행할 세션 <span id="sesCount"></span></div>
        <div class="seslist" id="seslist"></div>
        <div class="hint">세션을 클릭하면 <code>claude --resume &lt;id&gt;</code> 로 그 대화를 이어서 엽니다.</div>
      </div>
      <div class="mfoot"><button data-close>닫기</button></div>
    </div>
  </div>

  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="/vendor/split/split.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
