name: Build Windows exe (test)

# 릴리즈 발행은 release.yml 이 담당한다(태그 push). 이 워크플로는 **수동 테스트 빌드 전용** —
# Release 를 건드리지 않고 워크플로 아티팩트로만 exe 를 남긴다.
# (예전에는 이 파일도 태그 push 로 돌면서 릴리즈를 발행했는데, mac 워크플로와 draft 해제 시점이
#  엇갈려 늦게 끝난 쪽 업로드가 통째로 누락되는 문제가 있었다. → release.yml 로 일원화)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Download VC++ Redistributable (for node-pty on user machines without it)
        run: Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile build/vc_redist.x64.exe
        shell: pwsh

      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: claude-terminal-hub-windows
          path: dist/*.exe
