name: Build Windows exe

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'GitHub Release 로 발행할지 여부 (태그 push 없이 수동 릴리즈용)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Download VC++ Redistributable (for node-pty on user machines without it)
        run: Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile build/vc_redist.x64.exe
        shell: pwsh

      # 태그 push 또는 수동 릴리즈 발행: electron-builder 가 GitHub Release 를 직접 만들고
      # latest.yml 까지 올림(auto-update 에 필요). 태그가 없으면 package.json 버전 기준으로 만듦.
      - if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 그 외(수동 테스트 빌드): Release 를 건드리지 않고 워크플로 아티팩트로만 남김.
      - if: "!(startsWith(github.ref, 'refs/tags/') || inputs.publish == true)"
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: claude-terminal-hub-windows
          path: dist/*.exe
