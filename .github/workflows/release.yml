name: Release

# 태그 push 하나로 Windows exe + macOS dmg/zip 을 만들고 **정식 발행까지** 끝낸다.
#
# 왜 워크플로를 하나로 합쳤나:
#   예전에는 build-windows.yml / build-mac.yml 이 각각 태그 push 로 돌면서 각자 마지막에
#   `gh release edit --draft=false` 를 했다. 두 빌드 시간이 달라(mac 이 먼저 끝남) 한쪽이
#   draft 를 풀어버리면, 뒤늦게 끝난 쪽의 electron-builder 는 "이미 published 된 릴리즈"를
#   보고 업로드를 조용히 건너뛴다(스텝은 success 로 끝남). 실제로 v1.14.1 에서 Windows exe 와
#   latest.yml 이 통째로 누락됐다.
#   → 두 빌드가 **모두** 끝난 뒤에 별도 job 에서 한 번만 draft 를 푼다.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '이미 만들어둔 태그로 다시 빌드/발행 (예: v1.14.2). 비우면 현재 브랜치의 package.json 버전 사용'
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Download VC++ Redistributable (for node-pty on user machines without it)
        run: Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile build/vc_redist.x64.exe
        shell: pwsh

      # 릴리즈가 없으면 draft 로 먼저 만들어 둔다(두 job 이 동시에 만들려다 중복 생성되는 것 방지).
      # 발행(draft 해제)은 여기서 하지 않는다 — 아래 publish job 이 담당.
      - name: Ensure draft release exists
        shell: pwsh
        run: |
          $tag = "v" + (node -p "require('./package.json').version")
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title $tag --notes "Automated build"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & upload (Windows)
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 업로드가 실제로 됐는지 확인 — 스텝이 success 여도 조용히 건너뛰는 경우가 있었으므로 명시적으로 검증한다.
      - name: Verify Windows assets uploaded
        shell: pwsh
        run: |
          $tag = "v" + (node -p "require('./package.json').version")
          $names = gh release view $tag --json assets --jq '.assets[].name'
          Write-Host "assets: $names"
          if (-not ($names -match '\.exe$' -or $names -match '\.exe')) { throw "exe 가 릴리즈에 없습니다" }
          if (-not ($names -match 'latest\.yml')) { throw "latest.yml 이 없습니다 (auto-update 불가)" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Ensure draft release exists
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes "Automated build"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & upload (macOS)
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify macOS assets uploaded
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          NAMES=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "assets: $NAMES"
          echo "$NAMES" | grep -q '\.dmg$' || { echo "dmg 가 릴리즈에 없습니다"; exit 1; }
          echo "$NAMES" | grep -q 'latest-mac\.yml' || { echo "latest-mac.yml 이 없습니다 (auto-update 불가)"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 두 빌드가 모두 끝난 뒤에만 정식 발행. 이걸 해야 사용자에게 보이고 auto-update 가 잡는다.
  publish:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Publish release (draft 해제)
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "발행 완료: $TAG"
          gh release view "$TAG" --json isDraft,assets --jq '{draft:.isDraft, assets:[.assets[].name]}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
