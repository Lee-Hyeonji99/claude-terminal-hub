name: Publish draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '발행할 draft 릴리즈의 태그 (예: v1.13.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "${{ inputs.tag }}" --draft=false --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
