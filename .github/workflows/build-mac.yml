name: Build macOS app (test)

# 릴리즈 발행은 release.yml 이 담당한다(태그 push). 이 워크플로는 **수동 테스트 빌드 전용** —
# Release 를 건드리지 않고 워크플로 아티팩트로만 dmg/zip 을 남긴다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: claude-terminal-hub-mac
          path: |
            dist/*.dmg
            dist/*.zip
