name: Build macOS app

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'GitHub Release 로 발행할지 여부 (태그 push 없이 수동 릴리즈용)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # electron-builder 가 dmg/zip/latest-mac.yml 을 동시에 업로드하면서 릴리즈가 없으면
      # 각자 "만들기"를 레이스로 시도해 draft 가 중복 생성되는 문제가 있음 → 미리 draft 를
      # 하나 만들어두면(이미 있으면 건너뜀) electron-builder 는 거기에 파일만 채워 넣는다.
      - if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        name: Ensure draft release exists (avoid electron-builder concurrent-create race)
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes "Automated build"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 태그 push 또는 수동 릴리즈 발행: electron-builder 가 (위에서 미리 만들어둔) draft 릴리즈에
      # dmg/zip+latest-mac.yml 을 올림(auto-update 에 필요). 태그가 없으면 package.json 버전 기준으로 만듦.
      - if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # draft 로 남은 릴리즈를 정식 발행 (windows 워크플로와 중복 실행돼도 no-op)
      - if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        name: Publish release (draft 해제)
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 그 외(수동 테스트 빌드): Release 를 건드리지 않고 워크플로 아티팩트로만 남김.
      - if: "!(startsWith(github.ref, 'refs/tags/') || inputs.publish == true)"
        run: npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: claude-terminal-hub-mac
          path: |
            dist/*.dmg
            dist/*.zip
