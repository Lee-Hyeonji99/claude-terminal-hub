name: 오류 제보
description: 동작이 이상하거나 멈추는 문제를 알려주세요
title: "[오류] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        앱의 `문의 · 제보` 버튼으로 열었다면 버전·환경은 자동으로 채워져 있어요.
        **세션 제목·작업 경로·업무 내용이 담긴 스크린샷은 올리지 마세요** — 이 저장소는 전체 공개입니다.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      description: 기대한 것과 실제로 일어난 것
      placeholder: 예) 새 세션을 열고 재시작했더니 빈 세션이 떴어요
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 해 보는 방법
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: version
    attributes:
      label: 앱 버전
  - type: input
    id: env
    attributes:
      label: 환경 (OS · 셸)
